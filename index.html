<style>
  html, body { margin: 0; height: 100%; background: #14104a; overflow: hidden; touch-action: none;

  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; position: fixed; inset: 0; }
  /* loading screen: studio-logo slot (empty for now) + a quick bar; removed by app.ts when the first screen is ready */
  #boot { position: fixed; inset: 0; z-index: 5; background: #14104a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  #boot .logo-slot { width: 320px; height: 180px; max-width: 86vw; } /* the animated studio logo (src/logo.ts) draws into a canvas here */
  #boot .bar { width: 200px; height: 8px; border-radius: 4px; background: #ffffff22; overflow: hidden; }
  #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #7fd8ff; animation: boot 1s ease-in-out infinite alternate; }
  @keyframes boot { from { margin-left: 0 } to { margin-left: 60% } }
</style>
